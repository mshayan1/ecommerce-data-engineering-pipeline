
name: E-Commerce ETL Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository files
        run: |
          echo "Working directory:"
          pwd
          echo "Repository files:"
          ls -la "$GITHUB_WORKSPACE"
          test -f "$GITHUB_WORKSPACE/requirements.txt"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r "$GITHUB_WORKSPACE/requirements.txt"

      - name: Run ETL pipeline
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python "$GITHUB_WORKSPACE/etl_pipeline.py"
